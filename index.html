<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Thanksgiving Traitors</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}
/* Layout: one narrow candlelit column, phone-first; full-screen overlays for night, reveals and secret role checks */
:root{
  --bg:#150f12; --panel:#1f171b; --line:#3a2c31; --fg:#efe4d0; --muted:#a8968e;
  --blood:#b52a33; --blood-deep:#6e1419; --gold:#c9a24a; --faith:#5c9c86;
  --display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -10%, #3a1a20 0%, transparent 60%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:2.1rem;line-height:1.1}
h2{font-size:1.5rem}
h3{font-size:1.15rem;color:var(--gold)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
button{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:#2a1f24;color:var(--fg);padding:12px 16px;cursor:pointer;min-height:46px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--blood);border-color:var(--blood);color:#fff7ee}
button.gold{background:var(--gold);border-color:var(--gold);color:#1a1205}
button.ghost{background:transparent}
button.wide{width:100%}
button:disabled{opacity:.4;cursor:not-allowed}
label{font-weight:500}
input,select,textarea{font:inherit;background:#120c0f;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:150px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.code{font-family:var(--display);font-size:2.8rem;letter-spacing:.12em;color:var(--gold);text-align:center;line-height:1}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#181115;font-weight:500;min-width:0}
.chip span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.out{opacity:.45;text-decoration:line-through}
.chip.shield{border-color:var(--gold)}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.tag.m{color:var(--blood)} .tag.b{color:var(--muted)} .tag.s{color:var(--gold)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:.8rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.step.on{border-color:var(--blood);color:var(--fg);background:var(--blood-deep)}
.vote{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center}
.tally{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:10px}
.bar b{min-width:0;flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar i{display:block;height:12px;background:var(--blood);border-radius:3px}
.bar em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
.log{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.overlay{position:fixed;inset:0;z-index:50;background:#070405;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(20px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px, env(safe-area-inset-left,0px));overflow-y:auto}
.overlay .big{font-family:var(--display);font-size:clamp(2.2rem,11vw,4rem);line-height:1.05}
.overlay .role-t{color:var(--blood)} .overlay .role-f{color:var(--faith)}
.overlay .inner{max-width:480px;width:100%;display:flex;flex-direction:column;gap:16px}
.victims{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hold{user-select:none;-webkit-user-select:none;touch-action:none}
.fade{animation:fade .9s ease both}
@keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.6)}}
@keyframes fade{from{opacity:.0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.hero{text-align:center;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.candle{font-family:var(--display);color:var(--blood);font-size:1rem;letter-spacing:.3em}
.err{color:#ff8f8f;font-weight:500}
[hidden]{display:none!important}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
</style>

<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }

      S.locked = true; S.offer = null; if (hostReady) buzz("The Traitors have chosen."); save(); if (view==="host" && ov.hidden) render(); return;
    }
    if (!S || m.k!=="pick" || m.round!==S.round || S.phase!=="night" || !S.window || S.locked || S.offer) return;

    if (lists.every(Boolean)){
      const score = {};
      lists[0].forEach(name => { if (lists.every(l => l.includes(name))) score[name] = lists.reduce((t,l)=>t+l.indexOf(name),0); });
      const cands = Object.keys(score);
      const isDbl = S.dbl===S.round && S.mode!=="recruit" && traitorsAlive().length>0;
      if (!cands.length || (isDbl && cands.length<2)){

      }

      const best = Math.min(...cands.map(c=>score[c]));
      let tops = cands.filter(c=>score[c]===best);
      const bw = Math.min(...tops.map(worst)); tops = tops.filter(c=>worst(c)===bw);
      const chosen = tops[Math.floor(Math.random()*tops.length)];
      const vals = [chosen];
      if (isDbl){ const rest = cands.filter(c=>c!==chosen); const b2 = Math.min(...rest.map(c=>score[c])); let t2 = rest.filter(c=>score[c]===b2); const w2 = Math.min(...t2.map(worst)); t2 = t2.filter(c=>worst(c)===w2); vals.push(t2[Math.floor(Math.random()*t2.length)]); }

      if (S.mode==="recruit" && vic){

        publish(vic.pt, {k:"offer", round:S.round, tid:S.tid});
      } else {
        S.murder = vic ? vic.key : null; const v2 = vals[1] ? S.players.find(p=>p.name===vals[1]) : null; S.murder2 = v2 ? v2.key : null;
        S.locked = true; if (hostReady) buzz("The Traitors have chosen.");
        publish(S.tid, {k:"lock", round:S.round, v: vals.join(" and ")});
      }
    }
    save(); if (view==="host" && ov.hidden) render();
  }, ok => { relayOK = ok; const d=$("#relay"); if(d) d.textContent = ok ? "● Live" : "○ Reconnecting…"; });
}

const SHARE = {mission:.35, table:.35, night:.15, breakfast:.15};
const DUE_LABEL = {mission:"Round table", table:"Voting", night:"Breakfast", breakfast:"Breakfast entrance"};
function paceCheck(){
  if (!S.pace || !SHARE[S.phase]) { if (S.dueFor !== S.phase+"|"+S.round){ S.dueAt=null; S.dueFor=S.phase+"|"+S.round; } return; }
  const tag = S.phase+"|"+S.round; if (S.dueFor===tag) return;
  S.dueFor = tag; S.dueFired = false;
  const now = Date.now();
  if (S.phase==="mission" || !S.perRound){
    const roundsLeft = Math.max(1, Math.ceil((alive().length - S.finalSize)/2));
    let per = 25*60000;
    if (S.endMs) per = (S.endMs - 10*60000 - now) / roundsLeft;
    if (S.phase==="mission" && S.endMs && per < 15*60000 && !S.recruit && S.dbl!==S.round && S.dblOff!==S.round && alive().length - S.finalSize >= 4){
      S.dbl = S.round; S.dblBuzz = true; logit("Round "+S.round+": running behind, so tonight is a double murder.");
      per = (S.endMs - 10*60000 - now) / (1 + Math.ceil(Math.max(0, alive().length - 3 - S.finalSize)/2));
    }
    S.perRound = Math.max(8*60000, Math.min(60*60000, per));
  }
  S.dueAt = now + Math.round(S.perRound * SHARE[S.phase]);
}
function paceTick(){

  if (Date.now() < S.dueAt) return;

  const key = [live.round, live.phase, live.redo||0, called, mine.s, offerOpen, traitorWin, !!live.over, !!live.dbl].join("|");
  if (key === alertKey) return;
  const prev = alertKey; alertKey = key;

  let msg = "";

  else if (mine.s==="b") msg = "You were banished. You're a ghost now. Open your page.";
  else if (offerOpen) msg = "The Traitors have chosen you. Decide now.";
  else if (live.dbl && prev.split("|").slice(0,2).join("|")===key.split("|").slice(0,2).join("|") && prev.split("|")[8]==="false") msg = "Double murder tonight! Check your page.";
  else if (live.phase==="night" && live.redo) msg = "Not over yet! Open your night screen and pick again.";

  else if (live.phase==="breakfast" && called) msg = "You've been called. Come in to breakfast!";

function copyLink(t, btn){

  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><p style="font-size:1.2rem">${esc(msg)}</p><button class="primary wide" id="cy">${esc(label)}</button><button class="wide" id="cn">Cancel</button></div>`;
  $("#cy",ov).onclick = () => { ov.hidden=true; yes(); };
  $("#cn",ov).onclick = () => { ov.hidden=true; };
}

function passPhone(){
  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><h2>Whose role?</h2><p class="muted small">Hand the phone over. Only the player named should look.</p>
   <div class="victims">${S.players.map(p=>`<button data-who="${esc(p.key)}">${esc(p.name)}</button>`).join("")}</div>
   <button class="wide ghost" id="cx">Close</button></div>`;
  $("#cx",ov).onclick = () => { ov.hidden=true; };
  ov.querySelectorAll("[data-who]").forEach(b => b.onclick = () => { const p=byKey(b.dataset.who); secretReveal(p.name, p.traitor, p.seal, false, null, pinOf(S.code)); });
}

function countVotes(){
  const tl = tally(); if (!tl.length) return;
  const top = tl[0][1]; const tied = tl.filter(([,n])=>n===top).map(([k])=>k);
  if (tied.length>1){
    if (S.revotes>=1){ // second tie: fate decides
      const pick = tied[Math.floor(Math.random()*tied.length)];
      logit("Second tie between "+tied.map(k=>byKey(k).name).join(" and ")+". Fate chose.");
      return doBanish(pick, true);
    }
    S.candidates = tied; S.revotes++; S.votes={}; save(); render(); return;
  }
  doBanish(tied[0], false);
}
function doBanish(key, fate){
  const p = byKey(key); const n = Object.values(S.votes).filter(v=>v===key).length;
  { const pr = (S.preds||{})[S.round] || {}; S.ghostPts = S.ghostPts||{}; Object.entries(pr).forEach(([g,v]) => { if (v===p.name) S.ghostPts[g] = (S.ghostPts[g]||0) + 1; }); }
  p.status="banished"; logit(p.name+" was banished"+(fate?" by fate":" with "+n+" vote"+(n===1?"":"s"))+". They were "+(p.traitor?"a Traitor":"Faithful")+".");
  S.votes={}; S.candidates=null; S.revotes=0;
  if (p.traitor && traitorsAlive().length>0 && S.recruitOn!==false) S.recruit = true;
  save();
  dramatic(fate?"The tie stands. Fate has chosen":"The round table has spoken", p.name, "Their true role is", p.traitor, () => afterBanish());
}
function checkWin(){
  const t = traitorsAlive().length, f = alive().length - t;
  if (t===0){ S.winner="faithful"; S.phase="over"; return true; }
  if (t>=f){ S.winner="traitors"; S.phase="over"; return true; }
  return false;
}
function ghostMode(){ return S.players.filter(p=>p.status!=="alive").length>=2 ? "match" : "trivia"; }
function ghostResult(){
  const ghosts = S.players.filter(p=>p.status!=="alive"); const mode = ghostMode();
  const ans = (S.gans||{})[S.round]||{};
  if (!ghosts.length) return {won:false, text:"No ghosts yet."};
  if (mode==="trivia"){
    const qs = ghostQs("trivia", S.round); const sc = ghosts.map(g => { const a=(ans[g.name]||{}).ans||[]; return qs.filter((q,i)=>a[i]===q.right).length; });
    const best = Math.max(...sc); return {won: best>=3, text:`Trivia score: ${best} of ${GQN} (needs 3).`};
  }
  let matched = 0;
  for (let i=0;i<GQN;i++){ const c={}; ghosts.forEach(g => { const v=((ans[g.name]||{}).ans||[])[i]; if (v) c[v]=(c[v]||0)+1; });
    const top = Math.max(0, ...Object.values(c)); if (top>=2 && top*2>=ghosts.length) matched++; }
  return {won: matched>=3, text:`Matched ${matched} of ${GQN} answers (needs 3).`};
}
function ghostWonNow(){ const o=(S.ghostWon||{})[S.round]; return o===undefined ? (S.players.some(p=>p.status!=="alive") ? ghostResult().won : undefined) : o; }
function ghostShield(){
  if (!S.shields) return;
  const res = ghostResult(); const o=(S.ghostWon||{})[S.round]; const won = o===undefined ? res.won : o;
  const votes = (S.gvotes||{})[S.round] || {}; const c = {};
  Object.values(votes).forEach(v => { const p = S.players.find(x=>x.name===v); if (p && p.status==="alive") c[v]=(c[v]||0)+1; });
  const top = Object.entries(c); let pick = null;
  if (top.length){ const mx = Math.max(...top.map(x=>x[1])); const t = top.filter(x=>x[1]===mx).map(x=>x[0]); pick = t[Math.floor(Math.random()*t.length)]; }
  if (!won) pick = null;
  if (pick){ giveShield(S.players.find(x=>x.name===pick), true); logit("The ghosts gave out a secret shield."); }
  const played = Object.keys((S.gans||{})[S.round]||{}).length || o!==undefined;
  if (played && S.ghtid) publish(S.ghtid, {k:"gshield", round:S.round, v: pick || "", lost: !won, detail: o===undefined ? res.text : ""});
}
function openWindow(){ ghostShield(); S.sus={}; S.redo=0; S.window=true; S.locked=false; S.picks={}; S.murder=null; S.offer=null;
  S.mode = S.recruit ? "recruit" : "murder"; S.recruit = false;
  publish(S.tid, {k:"mode", round:S.round, mode:S.mode, names: traitorsAlive().map(x=>x.name)}); }
function afterBanish(){
  if (checkWin()){ save(); return render(); }
  if (S.phase==="final" || alive().length<=S.finalSize){ S.phase="final"; S.endVotes={}; save(); return render(); }
  S.phase="night"; if (S.pace) openWindow(); save(); render();
}
function endDecision(){
  const vs = alive().map(v=>S.endVotes[v.key]);
  if (vs.every(v=>v==="end")){
    logit("Everyone voted to end the game.");
    S.winner = traitorsAlive().length ? "traitors" : "faithful"; S.phase="over"; save(); return render();
  }
  logit("Not unanimous. Another banishment.");
  S.phase="final-table"; S.endVotes={};
  // reuse table for one more banishment, then back to final
  S.phase="table"; S._final=true; S.votes={}; S.candidates=null; S.revotes=0; save(); render();
}

// dramatic reveal (role reveal after banish or murder)
function dramatic(pre, name, mid, traitor, then){
  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><div class="eyebrow">${esc(pre)}</div><div class="big fade">${esc(name)}</div>
   <p class="muted">${esc(mid)}…</p><div id="rr" style="min-height:90px"></div>
   <button class="gold wide" id="rv">Reveal</button></div>`;
  $("#rv",ov).onclick = () => {
    $("#rr",ov).innerHTML = traitor ? `<div class="big role-t fade">a Traitor</div>` : `<div class="big role-f fade">Faithful</div>`;
    const b=$("#rv",ov); b.textContent="Continue"; b.className="wide"; b.onclick = () => { ov.hidden=true; then(); };
  };
}

// ---- night ----
function runNight(){
  const traitors = traitorsAlive();
  const victims = alive().filter(p=>!p.traitor && !p.shield);
  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><div class="big">Heads down</div><p class="muted">Everyone, close your eyes and put your heads down.</p></div>`;
  say("Night has fallen. Everyone, close your eyes, and put your heads down.");
  setTimeout(() => {
    say("Traitors. Open your eyes. Silently choose your victim on the phone.");
    ov.innerHTML = `<div class="inner"><div class="eyebrow">Traitors only</div><h2>Traitors, open your eyes</h2>
     <p>The Traitors: <b style="color:var(--blood)">${traitors.map(t=>esc(t.name)).join(", ")}</b></p>
     <p class="muted small">Agree in silence, by pointing. Then tap your victim.${S.shields&&alive().some(p=>p.shield)?" Shielded players are safe tonight.":""}</p>
     <div class="victims">${victims.map(v=>`<button data-kill="${esc(v.key)}">${esc(v.name)}</button>`).join("")}</div>
     <button class="ghost wide" id="spare">Spare everyone tonight</button></div>`;
    ov.querySelectorAll("[data-kill]").forEach(b => b.onclick = () => confirmKill(b.dataset.kill));
    $("#spare",ov).onclick = () => confirmKill(null);
  }, 7000);
}
function confirmKill(key){
  const p = key?byKey(key):null;
  ov.innerHTML = `<div class="inner"><h2>${p?"Murder "+esc(p.name)+"?":"Spare everyone?"}</h2>
   <button class="primary wide" id="ky">${p?"Yes, murder them":"Yes, no murder"}</button><button class="wide" id="kn">Choose again</button></div>`;
  $("#kn",ov).onclick = runNightPick;
  if (S.turret){ const k=$("#ky",ov); k.textContent = p?"Yes, murder them":"Yes, no murder"; }
  $("#ky",ov).onclick = () => {
    S.murder = key; save();
    if (S.turret){ S.turret=false; S.window=false; S.locked=true; S.phase="breakfast"; S.called=[]; save();
      ov.innerHTML = `<div class="inner"><div class="big">It is done</div><p class="muted">Lock this screen, put the phone back exactly where you found it, and return to the party looking innocent.</p><button class="wide" id="wk">Lock the screen</button></div>`;
      $("#wk",ov).onclick = () => { ov.hidden=true; render(); }; return; }
    say("Traitors, close your eyes, and put your heads down.");
    ov.innerHTML = `<div class="inner"><div class="big">Heads down</div><p class="muted">Traitors, close your eyes.</p></div>`;
    setTimeout(() => {
      say("Everyone. Wake up. Breakfast will reveal what happened in the night.");
      S.phase="breakfast"; save();
      ov.innerHTML = `<div class="inner"><div class="big">Wake up</div><p class="muted">The night is over. The murder will be revealed at breakfast.</p><button class="wide" id="wk">Continue</button></div>`;
      $("#wk",ov).onclick = () => { ov.hidden=true; render(); };
    }, 6000);
  };
}
function fmtTime(t){ const m=/^(\d{1,2}):(\d{2})/.exec(t||""); if(!m) return t; let h=+m[1]; const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+m[2]+" "+ap; }
function copyText(t, btn){
  const done = () => { const o=btn.textContent; btn.textContent="Copied"; setTimeout(()=>btn.textContent=o,1500); };
  try{ navigator.clipboard.writeText(t).then(done, () => sel()); }catch(e){ sel(); }
  function sel(){ const el=btn.previousElementSibling; if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } }
}
function announceText(){
  const end = S.endsAt?` The game ends at ${fmtTime(S.endsAt)}.`:"";
  return ({
    lobby:"Open your link and check your secret role. The game starts soon.",
    mission:"Shield challenge starting in 5 minutes! Winners get a shield that protects them from murder tonight.",
    table:"Round table in 5 minutes. Time to banish someone. Bring your suspicions."+end,
    night:"Night has fallen. Everyone, open your night screen.",
    breakfast:"Breakfast time. Everyone wait outside the breakfast room. You'll be called in one at a time.",
    final:"Endgame. Everyone left, to the table now. Decide: end the game or banish again.",
    over:"The game is over."
  })[S.phase] || "";
}
function announceCard(){
  const end = S.endsAt?` The game ends at ${fmtTime(S.endsAt)}.`:"";
  const m = {
    mission:"Shield challenge starting in 5 minutes! Winners get a shield that protects them from murder tonight.",
    table:"Round table in 5 minutes. Time to banish someone. Bring your suspicions."+end,
    night:"Night has fallen. Check your page. Breakfast will be called soon.",
    breakfast:"Breakfast time. Everyone wait outside the breakfast room. You'll be called in one at a time.",
    final:"Endgame. Everyone left, to the table now. It's time to decide whether to end the game or banish again."
  }[S.phase];
  if (!m) return "";
  return `<div class="card"><h3>Message for the group text</h3><p class="muted small">Everyone's page already shows this. Text it too so phones buzz.</p><p id="ann">${esc(m)}</p><button class="wide" data-copy="${esc(m)}">Copy message</button></div>`;
}
function turretLock(){
  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><div class="eyebrow">The turret</div><div class="big">Traitors only</div>
   <p class="muted">If you aren't a Traitor, put this phone back and walk away.</p>
   <div class="field"><label for="pin">Traitor PIN</label><input id="pin" inputmode="numeric" autocomplete="off" maxlength="4" style="text-align:center;font-size:1.6rem;letter-spacing:.3em"></div>
   <p class="err" id="pinerr" hidden></p>
   <button class="primary wide" id="unl">Unlock</button>
   <button class="ghost" id="tcancel" style="margin-top:30px">Host: close the murder window</button></div>`;
  $("#unl",ov).onclick = () => {
    if ($("#pin",ov).value.trim()===pinOf(S.code)) return runNightPick();
    const e=$("#pinerr",ov); e.textContent="Wrong PIN."; e.hidden=false; $("#pin",ov).value="";
  };
  $("#tcancel",ov).onclick = () => { ov.innerHTML = `<div class="inner"><p style="font-size:1.2rem">Close the murder window without a murder? Only do this if the Traitors ran out of time.</p><button class="primary wide" id="cy">Close it, nobody dies</button><button class="wide" id="cn">Keep it open</button></div>`;
    $("#cy",ov).onclick = () => { S.turret=false; S.murder=null; S.phase="breakfast"; save(); ov.hidden=true; render(); };
    $("#cn",ov).onclick = turretLock; };
}
function runNightPick(){ // back to picking without re-narration
  const traitors = traitorsAlive(); const victims = alive().filter(p=>!p.traitor && !p.shield);
  ov.innerHTML = `<div class="inner"><div class="eyebrow">Traitors only</div><h2>Choose your victim</h2>
   <p>The Traitors: <b style="color:var(--blood)">${traitors.map(t=>esc(t.name)).join(", ")}</b></p>
   <div class="victims">${victims.map(v=>`<button data-kill="${esc(v.key)}">${esc(v.name)}</button>`).join("")}</div>
   <button class="ghost wide" id="spare">Spare everyone tonight</button></div>`;
  ov.querySelectorAll("[data-kill]").forEach(b => b.onclick = () => confirmKill(b.dataset.kill));
  $("#spare",ov).onclick = () => confirmKill(null);
}
function breakfast(){
  let blocked = false;
  const vics = [S.murder, S.murder2].filter(Boolean).filter((k,i,a)=>a.indexOf(k)===i).map(byKey).filter(p => { if (p.shield){ blocked = true; return false; } return p.status==="alive"; });
  const victim = vics[0] || null;
  const queue = alive().filter(p => !vics.includes(p)).map(p=>p.key);
  for (let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
  let idx = 0; S.called = []; save();
  const next = () => { S.murder=null; S.murder2=null; S.sus={}; S.called=[]; S.picks={}; S.window=false; S.locked=false; S.players.forEach(p=>p.shield=false); S.round++; if (checkWin()){ save(); return render(); }
    S.phase = alive().length<=S.finalSize ? "final" : "mission"; S.endVotes={}; save(); render(); };
  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><div class="eyebrow">Breakfast</div><div class="big">Breakfast is served</div>
    <p class="muted">Everyone wait outside. I'll call you in one at a time.</p>
    <button class="gold wide" id="call" style="min-height:70px">Call the first guest</button></div>`;
  say("Breakfast is served. Everyone, wait outside. I will call you in, one at a time.");
  const call = () => {
    if (idx >= queue.length) return finale();
    const p = byKey(queue[idx++]);
    S.called = (S.called||[]).concat(p.name); save();
    say(p.name + ". Come in to breakfast.");
    ov.innerHTML = `<div class="inner"><div class="eyebrow">Guest ${idx} of ${queue.length + vics.length}</div>
      <div class="big fade">${esc(p.name)}</div><p class="muted">Come in to breakfast.</p>
      <button class="gold wide" id="call" style="min-height:70px">${idx>=queue.length?"Everyone's called. Who's missing?":"Call the next guest"}</button></div>`;
    $("#call",ov).onclick = call;
  };
  const susLine = ""; const _unusedSus = (() => { const g = S.sus||{}; const n = Object.keys(g).length; if (!n || !victim) return "";
    const answer = victim.name;
    const right = Object.entries(g).filter(([by,v]) => Array.isArray(v) && v.includes(answer)).map(([by,v]) => v[0]===answer ? by+" ⭐" : by);
    return `<p class="small" style="color:var(--gold)">${right.length ? `🔮 Had it in their top 3: <b>${right.map(esc).join(", ")}</b> (${right.length} of ${n}). ⭐ = guessed it first.` : `🔮 Nobody saw it coming. ${n} people guessed.`}</p>`; })();
  const finale = () => {
    if (!victim){
      logit(blocked ? "The Traitors' victim was protected by a shield." : "The Traitors spared everyone.");
      say("Everyone made it through the night.");
      ov.innerHTML = `<div class="inner"><div class="eyebrow">Breakfast</div><div class="big fade">Everyone survived</div><p class="muted">${blocked?(S.murder2?"The Traitors struck twice, but both victims were protected by shields.":"The Traitors struck, but their victim was protected by a shield."):"The Traitors held back last night. Why?"}</p>${susLine}<button class="wide" id="bc">Continue</button></div>`;
      $("#bc",ov).onclick = () => { ov.hidden=true; next(); }; return;
    }
    say("Everyone who survived the night is here. Whoever is still outside, was murdered.");
    const many = vics.length>1; const saved = blocked ? `<p class="small" style="color:var(--gold)">🛡 One of the Traitors' victims was protected by a shield.</p>` : "";
    ov.innerHTML = `<div class="inner"><div class="eyebrow">Breakfast</div><h2>Everyone who survived is here</h2>
      <p class="muted">Whoever is still outside was murdered by the Traitors.</p><div id="mr" style="min-height:120px"></div>
      <button class="gold wide" id="mv">Reveal the ${many?"victims":"victim"}</button></div>`;
    $("#mv",ov).onclick = () => {
      vics.forEach(v => { v.status="murdered"; logit(v.name+" was murdered in the night."); }); save();
      const names = vics.map(v=>v.name).join(" and ");
      $("#mr",ov).innerHTML = `<div class="big fade" style="color:var(--blood)">${esc(names)}</div><p class="muted">Murdered. ${many?"They were both Faithful. Let them in.":"They were Faithful. Let them in."}</p>${saved}${susLine}`;
      say(names + (many?" were murdered. They were both Faithful.":" was murdered. They were Faithful."));
      const b=$("#mv",ov); b.textContent="Continue"; b.className="wide"; b.onclick = () => { ov.hidden=true; next(); };
    };
  };
  $("#call",ov).onclick = call;
}

// patch afterBanish for the endgame loop
const _afterBanish = afterBanish;
afterBanish = function(){ if (S._final){ S._final=false; if (checkWin()){ save(); return render(); } S.phase="final"; S.endVotes={}; save(); return render(); } _afterBanish(); };

// ---- lobby & over ----
function renderLobby(){
  app.innerHTML = `
  <div class="hero"><div class="eyebrow">Game phone · The Traitors are chosen</div><h2>Hand out the links</h2>
   <p class="muted">Each player gets their own private page. Tap below, then <b>Pass it around</b>: everyone scans their own QR code with their phone camera.</p>
   <button class="primary wide" id="links" style="margin-top:10px">Hand out personal links</button></div>
  <div class="card"><h3>Players and seals</h3>
   <div class="roster">${S.players.map(p=>`<div class="chip"><span>${esc(p.name)}</span><span class="tag s">${esc(p.seal)}</span></div>`).join("")}</div>
   <p class="muted small">Backup: if a link won't open, a guest can type game code <b>${esc(S.code)}</b> and their name on the home screen. The two-letter seal on their phone should match the one here. No phone at all? Tap below and pass this phone around.</p>
   <button class="wide" id="roleChk">Check roles on this phone</button></div>
  <div class="card"><p>Everyone knows their role? Begin with the first challenge.</p>
   <button class="primary wide" id="start">Start round 1</button></div>
  <div class="row"><button class="ghost" id="home">Home</button><button class="ghost" id="reset">Start over</button></div>`;
  $("#roleChk").onclick = passPhone;
  $("#links").onclick = linksBox;
  $("#start").onclick = () => { S.phase="mission"; save(); render(); };
  $("#home").onclick = () => { view="home"; render(); };
  $("#reset").onclick = () => confirmBox("Start over? New Traitors will be chosen.", "Start over", () => { S=null; try{localStorage.removeItem(KEY);}catch(e){} render(); });
}
function bestGhostLine(gp){ const e = Object.entries(gp).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]); if (!e.length) return ""; const mx = e[0][1]; const w = e.filter(x=>x[1]===mx).map(x=>x[0]);
  return `<p style="color:var(--gold)">👻 Best ghost: <b>${w.map(esc).join(" and ")}</b> with ${mx} point${mx===1?"":"s"}.</p>`; }
function renderOver(){
  const fw = S.winner==="faithful";
  const tr = S.players.filter(p=>p.traitor);
  app.innerHTML = `
  <div class="hero"><div class="eyebrow">The game is over</div>
   <div class="code" style="font-size:2.4rem;color:${fw?"var(--faith)":"var(--blood)"}">${fw?"The Faithful win":"The Traitors win"}</div>
   <p>${fw?"Every Traitor has been found. The Faithful share the prize pot.":"A Traitor survived to the end. The Traitors take the prize pot."}</p>${bestGhostLine(S.ghostPts||{})}</div>
  <div class="card"><h3>The Traitors were</h3><div class="roster">${tr.map(p=>`<div class="chip"><span>${esc(p.name)}</span><span class="tag m">${p.status==="alive"?"Survived":"Banished"}</span></div>`).join("")}</div></div>
  <div class="card"><h3>Everyone</h3><div class="roster">${S.players.map(chip).join("")}</div></div>
  ${S.log.length?`<div class="card"><h3>How it went</h3><div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div></div>`:""}
  <button class="primary wide" id="again">Play again with the same names</button>
  <button class="ghost" id="home">Home</button>`;
  $("#again").onclick = () => { draft.names = S.players.map(p=>p.name).join("\n"); saveDraft(); S=null; try{localStorage.removeItem(KEY);}catch(e){} render(); };
  $("#home").onclick = () => { view="home"; render(); };
}

load();
if (S && S.tid) { hostListen(); broadcast(); }
personal = parseToken(location.hash);
window.addEventListener("hashchange", () => { personal = parseToken(location.hash); render(); });
render();
if (!personal && S && S.turret){ view="host"; render(); turretLock(); }
})();
</script>
