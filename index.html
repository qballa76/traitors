<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Thanksgiving Traitors</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}
/* Layout: one narrow candlelit column, phone-first; full-screen overlays for night, reveals and secret role checks */
:root{
  --bg:#150f12; --panel:#1f171b; --line:#3a2c31; --fg:#efe4d0; --muted:#a8968e;
  --blood:#b52a33; --blood-deep:#6e1419; --gold:#c9a24a; --faith:#5c9c86;
  --display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -10%, #3a1a20 0%, transparent 60%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:2.1rem;line-height:1.1}
h2{font-size:1.5rem}
h3{font-size:1.15rem;color:var(--gold)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
button{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:#2a1f24;color:var(--fg);padding:12px 16px;cursor:pointer;min-height:46px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--blood);border-color:var(--blood);color:#fff7ee}
button.gold{background:var(--gold);border-color:var(--gold);color:#1a1205}
button.ghost{background:transparent}
button.wide{width:100%}
button:disabled{opacity:.4;cursor:not-allowed}
label{font-weight:500}
input,select,textarea{font:inherit;background:#120c0f;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:150px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.code{font-family:var(--display);font-size:2.8rem;letter-spacing:.12em;color:var(--gold);text-align:center;line-height:1}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#181115;font-weight:500;min-width:0}
.chip span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.out{opacity:.45;text-decoration:line-through}
.chip.shield{border-color:var(--gold)}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.tag.m{color:var(--blood)} .tag.b{color:var(--muted)} .tag.s{color:var(--gold)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:.8rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.step.on{border-color:var(--blood);color:var(--fg);background:var(--blood-deep)}
.vote{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center}
.tally{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:10px}
.bar b{min-width:0;flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar i{display:block;height:12px;background:var(--blood);border-radius:3px}
.bar em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
.log{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.overlay{position:fixed;inset:0;z-index:50;background:#070405;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(20px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px, env(safe-area-inset-left,0px));overflow-y:auto}
.overlay .big{font-family:var(--display);font-size:clamp(2.2rem,11vw,4rem);line-height:1.05}
.overlay .role-t{color:var(--blood)} .overlay .role-f{color:var(--faith)}
.overlay .inner{max-width:480px;width:100%;display:flex;flex-direction:column;gap:16px}
.victims{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hold{user-select:none;-webkit-user-select:none;touch-action:none}
.fade{animation:fade .9s ease both}
@keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.6)}}
@keyframes fade{from{opacity:.0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.hero{text-align:center;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.candle{font-family:var(--display);color:var(--blood);font-size:1rem;letter-spacing:.3em}
.err{color:#ff8f8f;font-weight:500}
[hidden]{display:none!important}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
</style>

</head><body>
<div class="wrap" id="app"></div>
<div class="overlay" id="ov" hidden></div>

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const app = $("#app"), ov = $("#ov");
const KEY = "thanksgiving-traitors-v1";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g,"");
function hash(str){ // FNV-1a 32-bit
  let h = 0x811c9dc5;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  // extra avalanche
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0; h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0; h ^= h >>> 16;
  return h >>> 0;
}
const LET = "ABCDEFGHJKLMNPQRSTUVWXYZ";
const SEAL = "ABCDEFGHJKLMNPRSTUVWXYZ";
function isTraitor(code, key){ const p = parseInt(code.slice(4),10); return (hash(code.slice(0,4)+"|"+key) % 100) < p; }
function sealOf(code, key){ const h = hash("seal|"+code+"|"+key); return SEAL[h % SEAL.length] + SEAL[(h>>>8) % SEAL.length]; }
const BASE = location.origin + location.pathname;
function ks(code, i){ return hash("ks|"+code+"|"+i) & 255; }
function payloadFor(p){ return p.name.trim() + "|" + (p.traitor ? S.players.filter(o=>o.traitor && o.key!==p.key).map(o=>o.name.trim()).join(",") : "") + "|" + S.gid + "|" + (p.traitor ? S.tid : "") + "|" + (p.pt||""); }
function tokenFor(code, payload, len){
  const raw = new TextEncoder().encode(payload);
  const bytes = new Uint8Array(Math.max(len||0, raw.length)); bytes.fill(32); bytes.set(raw);
  let hex = ""; bytes.forEach((b,i) => hex += ((b ^ ks(code,i)).toString(16).padStart(2,"0")));
  const ck = (hash("ck|"+code+"|"+payload) & 255).toString(16).padStart(2,"0");
  return code + "-" + hex + ck;
}
function linkFor(p){
  const len = Math.max(...S.players.map(o => new TextEncoder().encode(payloadFor(o)).length));
  return BASE + "#" + tokenFor(S.code, payloadFor(p), len);
}
function parseToken(h){
  const m = /^#?([A-Z]{4}\d{2})-([0-9a-f]{4,})$/.exec(h||""); if (!m) return null;
  const code = m[1], hex = m[2].slice(0,-2), ck = m[2].slice(-2);
  if (hex.length % 2) return null;
  const bytes = new Uint8Array(hex.length/2);
  for (let i=0;i<bytes.length;i++) bytes[i] = parseInt(hex.substr(i*2,2),16) ^ ks(code,i);
  let payload; try{ payload = new TextDecoder("utf-8",{fatal:true}).decode(bytes).replace(/ +$/,""); }catch(e){ return null; }
  if ((hash("ck|"+code+"|"+payload) & 255).toString(16).padStart(2,"0") !== ck) return null;
  const [name, fl, gid, tid, pt] = payload.split("|");
  return {code, name, fellows: fl ? fl.split(",") : [], gid: gid||"", tid: tid||"", pt: pt||""};
}
function pinOf(code){ return String(hash("pin|"+code) % 9000 + 1000); }
function makeCode(keys, k){
  const n = keys.length;
  const p = Math.max(1, Math.min(99, Math.round(100*k/n)));
  for (let t=0;t<200000;t++){
    let c=""; for(let i=0;i<4;i++) c += LET[Math.floor(Math.random()*LET.length)];
    c += String(p).padStart(2,"0");
    let cnt=0; for (const key of keys) if (isTraitor(c,key)) cnt++;
    if (cnt===k) return c;
  }
  return null;
}

// ---------- live relay (ntfy.sh) ----------
const RELAY = "https://ntfy.sh/";
function rid(n){ const a="abcdefghijkmnopqrstuvwxyz23456789"; let r=""; const b=new Uint8Array(n); crypto.getRandomValues(b); b.forEach(x=>r+=a[x%a.length]); return r; }
function publish(topic, obj){ try{ return fetch(RELAY+topic, {method:"POST", body:JSON.stringify(obj)}).catch(()=>{}); }catch(e){} }
function subscribe(topics, onMsg, onStatus){
  let es;
  try{ es = new EventSource(RELAY + topics.join(",") + "/sse?since=all"); }catch(e){ onStatus(false); return; }
  es.onopen = () => onStatus(true);
  es.onerror = () => onStatus(false);
  es.onmessage = e => { try{ const d = JSON.parse(e.data); if (d.event==="message") onMsg(d.topic, JSON.parse(d.message)); }catch(_){} };
}
let lastSent = "", pubTimer = null;
function publicState(){
  const pl = S.players.map(p=>({n:p.name, s:p.status[0], sh:(p.shield && !S.secretShields)?1:0}));
  return {k:"state", round:S.round, phase:S.phase, win:!!(S.window && !S.locked), called:S.called||[], ann:announceText(), ends:S.endsAt||"",
    players:pl, over: S.phase==="over" ? {w:S.winner, t:S.players.filter(p=>p.traitor).map(p=>p.name)} : null};
}
function broadcast(){
  if (!S || !S.gid) return;
  clearTimeout(pubTimer);
  pubTimer = setTimeout(() => { const st = publicState(); const js = JSON.stringify(st); if (js===lastSent) return; lastSent = js; st.seq = Date.now(); publish(S.gid, st); }, 300);
}
let hostSub = false, relayOK = null, hostReady = false; setTimeout(()=>{ hostReady = true; }, 2500);
function hostListen(){
  if (hostSub || !S || !S.tid) return; hostSub = true;
  subscribe([S.tid].concat(S.players.map(p=>p.pt).filter(Boolean)), (topic, m) => {
    if (S && m.k==="sus"){
      const p = S.players.find(x=>x.pt===topic);
      if (p && m.round===S.round && S.phase==="night"){ S.sus = S.sus||{}; S.sus[p.name] = m.v; save(); }
      return;
    }
    if (S && m.k==="claim"){
      const p = S.players.find(x=>x.pt===topic);
      if (!p || m.round!==S.round || m.done) return;
      if (S.codeRound===S.round && !S.codeClaimed && p.status==="alive" && String(m.code||"").trim().toUpperCase()===S.shieldCode && S.phase!=="night" && S.phase!=="breakfast"){
        S.codeClaimed = true; giveShield(p); save(); if (view==="host" && ov.hidden) render();
      } else if (m.at > Date.now()-15000) publish(p.pt, {k:"claimno", round:S.round});
      return;
    }
    if (topic!==S.tid) return;
    if (S && m.k==="answer" && S.offer && m.round===S.offer.round && !S.locked){
      const r = byKey(S.offer.key);
      if (m.yes){ r.traitor = true; S.murder = null; logit("A Faithful accepted the Traitors' ultimatum.");
        publish(r.pt, {k:"joined", round:S.round, tid:S.tid, fellows: traitorsAlive().filter(x=>x.key!==r.key).map(x=>x.name)});
        publish(S.tid, {k:"team", round:S.round, names: traitorsAlive().map(x=>x.name), joined:r.name});
      } else { S.murder = r.key; publish(S.tid, {k:"refused", round:S.round, by:r.name}); publish(r.pt, {k:"refused", round:S.round}); }
      S.locked = true; S.offer = null; if (hostReady) buzz("The Traitors have chosen."); save(); if (view==="host" && ov.hidden) render(); return;
    }
    if (!S || m.k!=="pick" || m.round!==S.round || S.phase!=="night" || !S.window || S.locked || S.offer) return;
    S.picks = S.picks || {}; S.picks[m.by] = m.v;
    const tr = traitorsAlive().map(p=>p.name);
    const vals = tr.map(n => S.picks[n]);
    if (vals.every(v => v!==undefined && v===vals[0])){
      const vic = vals[0]==="-" ? null : S.players.find(p=>p.name===vals[0]);
      if (S.mode==="recruit" && vic){
        S.offer = {key: vic.key, round: S.round};
        publish(S.tid, {k:"lock", round:S.round, v: vals[0], mode:"recruit"});
        publish(vic.pt, {k:"offer", round:S.round, tid:S.tid});
      } else {
        S.murder = vic ? vic.key : null; S.locked = true; if (hostReady) buzz("The Traitors have chosen.");
        publish(S.tid, {k:"lock", round:S.round, v: vals[0]});
      }
    }
    save(); if (view==="host" && ov.hidden) render();
  }, ok => { relayOK = ok; const d=$("#relay"); if(d) d.textContent = ok ? "● Live" : "○ Reconnecting…"; });
}

// ---------- alerts ----------
let actx = null;
function unlockAudio(){ try{ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
document.addEventListener("pointerdown", unlockAudio, {passive:true});
document.addEventListener("keydown", unlockAudio);
function chime(){
  try{ unlockAudio(); if(!actx) return; const t0 = actx.currentTime;
    [[523.25,0],[659.25,.18],[783.99,.36]].forEach(([f,d]) => { const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(0.35,t0+d+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.5);
      o.connect(g); g.connect(actx.destination); o.start(t0+d); o.stop(t0+d+0.55); }); }catch(e){}
}
const BASE_TITLE = document.title;
function buzz(text){
  try{ if (navigator.vibrate) navigator.vibrate([350,150,350,150,350]); }catch(e){}
  chime();
  document.title = "🔴 Check your phone";
  let b = document.getElementById("alertBar");
  if (!b){ b = document.createElement("button"); b.id = "alertBar"; document.body.appendChild(b);
    b.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:60;border:0;border-radius:0;background:var(--blood);color:#fff7ee;font:inherit;font-weight:700;font-size:1.1rem;min-height:64px;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));animation:flash 1s ease-in-out 4";
    b.onclick = () => { b.hidden = true; document.title = BASE_TITLE; window.scrollTo({top:0,behavior:"smooth"}); }; }
  b.textContent = "🔔 " + text + "  (tap)"; b.hidden = false;
  b.style.animation = "none"; void b.offsetWidth; b.style.animation = "flash 1s ease-in-out 4";
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(()=>{ document.title = BASE_TITLE; }, 4000); });

// ---------- state ----------
let S = null;
function load(){ try{ const raw = localStorage.getItem(KEY); if(raw) S = JSON.parse(raw); }catch(e){ S = null; } }
function save(){ if (S) paceCheck(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} broadcast(); }
// ---------- auto pacing ----------
const SHARE = {mission:.35, table:.35, night:.15, breakfast:.15};
const DUE_LABEL = {mission:"Round table", table:"Voting", night:"Breakfast", breakfast:"Breakfast entrance"};
function paceCheck(){
  if (!S.pace || !SHARE[S.phase]) { if (S.dueFor !== S.phase+"|"+S.round){ S.dueAt=null; S.dueFor=S.phase+"|"+S.round; } return; }
  const tag = S.phase+"|"+S.round; if (S.dueFor===tag) return;
  S.dueFor = tag; S.dueFired = false;
  const now = Date.now();
  if (S.phase==="mission" || !S.perRound){
    const roundsLeft = Math.max(1, Math.ceil((alive().length - S.finalSize)/2));
    let per = 25*60000;
    if (S.endMs) per = (S.endMs - 10*60000 - now) / roundsLeft;
    S.perRound = Math.max(8*60000, Math.min(60*60000, per));
  }
  S.dueAt = now + Math.round(S.perRound * SHARE[S.phase]);
}
function paceTick(){
  if (S && S.pace && view==="host" && S.endMs && !S.endWarned && Date.now() > S.endMs - 12*60000 && (S.phase==="mission"||S.phase==="table")){ S.endWarned = true; save(); buzz("Time's nearly up. Finish this round table, then tap \"Time's up: go to the endgame\"."); }
  if (!S || !S.pace || !S.dueAt || S.dueFired || view!=="host") return;
  const el = $("#paceLeft"); if (el) el.textContent = leftText();
  if (Date.now() < S.dueAt) return;
  S.dueFired = true;
  if (S.phase==="mission"){ S.phase="table"; S.votes={}; S.candidates=null; S.revotes=0; save(); buzz("Round table time. Gather everyone at the table."); return render(); }
  if (S.phase==="table"){ save(); buzz("Time to vote. Go around the table and enter the votes."); return render(); }
  if (S.phase==="night"){
    if (S.locked){ S.window=false; S.phase="breakfast"; S.called=[]; save(); buzz("Breakfast time. Everyone wait outside the room."); return render(); }
    save(); buzz("The Traitors still haven't chosen. Give them a nudge."); return render();
  }
  if (S.phase==="breakfast"){ save(); buzz("Start the breakfast entrance."); return render(); }
}
function leftText(){ const m = Math.round((S.dueAt - Date.now())/60000); return m<=0 ? "now" : "in "+m+" min"; }
setInterval(() => { try{ paceTick(); }catch(e){} }, 10000);
function paceCard(){
  if (!S.pace) return "";
  if (S.phase==="final") return `<div class="card" style="border-color:var(--gold)"><p>⏱ <b>Endgame.</b> No more timers. Finish it whenever you're ready.</p></div>`;
  if (!S.dueAt) return "";
  const next = DUE_LABEL[S.phase];
  const auto = S.phase==="mission" ? "The game moves to the round table by itself." : S.phase==="night" ? (S.locked ? "The Traitors have chosen. Breakfast starts by itself." : "Waiting for the Traitors.") : "This phone buzzes you when it's time.";
  return `<div class="card" style="border-color:var(--gold)"><p>⏱ <b>${esc(next)}</b> at ${esc(new Date(S.dueAt).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}))} · <span id="paceLeft">${esc(leftText())}</span></p><p class="muted small">${auto} Keep this phone's screen on.</p>
   <div class="row"><button class="ghost" id="paceNow" style="padding:6px 12px;min-height:36px">Do it now</button><button class="ghost" id="pace5" style="padding:6px 12px;min-height:36px">+5 min</button></div></div>`;
}
const alive = () => S.players.filter(p => p.status==="alive");
const byKey = k => S.players.find(p => p.key===k);
const traitorsAlive = () => alive().filter(p => p.traitor);
function logit(t){ S.log.unshift("Round "+S.round+": "+t); }

let view = "home"; // home | player | host
let draft = {names:"Susan\nStephen\nEthan\nMitch\nSally\nStephanie\nTony\nSevin\nMaddox\nValerie\nLevi\nNoah\nBear", k:"2", finalSize:"4", shields:true, endsAt:""};
try{ const d = localStorage.getItem(KEY+"-draft"); if(d) draft = Object.assign(draft, JSON.parse(d)); }catch(e){}
function saveDraft(){ try{ localStorage.setItem(KEY+"-draft", JSON.stringify(draft)); }catch(e){} }

// ---------- speech ----------
function say(text){
  try{ if(!("speechSynthesis" in window)) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = .88; u.pitch = .8; window.speechSynthesis.speak(u); }catch(e){}
}

// ---------- render ----------
let personal = null;
function render(){
  if (personal) return renderPersonal();
  if (view==="player") return renderPlayer();
  if (view==="host") return S ? renderHost() : renderSetup();
  renderHome();
}

function renderHome(){
  app.innerHTML = `
  <div class="hero"><div class="candle">✦ ✦ ✦</div><h1>The Thanksgiving Traitors</h1>
  <p class="muted">Among the family sit Traitors. Find them before dessert runs out.</p></div>
  <div class="card"><h3>Guests</h3><p>Open the personal link the host texted you. It takes you to your own private page.</p></div>
  <div class="card"><h3>Game phone</h3><p class="muted small">One phone runs the whole game and sits at the table. It picks the Traitors, counts votes and runs the night.</p>
    <button class="wide" id="goHost">${S ? "Continue the game" : "Set up a new game"}</button></div>`;
  $("#goHost").onclick = () => { view="host"; render(); };
}

// ---- player (own phone) ----
let pForm = {code:"", name:""};
function renderPlayer(){
  app.innerHTML = `
  <div class="hero"><div class="eyebrow">Your secret role</div><h2>Who are you, really?</h2></div>
  <div class="card">
    <div class="field"><label for="pc">Game code</label><input id="pc" autocomplete="off" autocapitalize="characters" placeholder="e.g. GRAV18" value="${esc(pForm.code)}"></div>

  $("#ss").onchange = e => { draft.secretShields = e.target.checked; saveDraft(); };
  $("#pace").onchange = e => { draft.pace = e.target.checked; saveDraft(); };
  $("#rc").onchange = e => { draft.recruit = e.target.checked; saveDraft(); };
  $("#ends").onchange = e => { draft.endsAt = e.target.value; saveDraft(); };
  $("#back").onclick = () => { view="home"; render(); };
  $("#create").onclick = () => {
    const names = parseNames(draft.names), err = $("#serr");
    const kk = draft.k==="auto" ? autoK(names.length) : parseInt(draft.k,10);
    const keys = names.map(norm);
    if (names.length < 5){ err.textContent="You need at least 5 players."; err.hidden=false; return; }
    if (keys.some(x=>!x)){ err.textContent="Each name needs at least one letter or number."; err.hidden=false; return; }
    const dup = keys.find((x,i)=>keys.indexOf(x)!==i);
    if (dup){ err.textContent="Two names are too similar ("+dup+"). Add a last initial to one of them."; err.hidden=false; return; }
    if (kk*2 >= names.length){ err.textContent="Too many Traitors for this many players."; err.hidden=false; return; }
    const code = makeCode(keys, kk);
    if (!code){ err.textContent="Couldn't pick Traitors. Tap again."; err.hidden=false; return; }
    let endMs = null; if (draft.endsAt){ const [hh,mm] = draft.endsAt.split(":").map(Number); const d = new Date(); d.setHours(hh,mm,0,0); if (d.getTime() <= Date.now()) d.setDate(d.getDate()+1); endMs = d.getTime(); }
    S = { code, pace: draft.pace!==false, endMs, recruitOn: draft.recruit!==false, gid:"tg"+rid(18), tid:"tt"+rid(18), called:[], picks:{}, window:false, locked:false, endsAt:draft.endsAt||"", turret:false, round:1, phase:"lobby", finalSize:parseInt(draft.finalSize,10), shields:!!draft.shields, secretShields: draft.secretShields!==false,
      players: names.map((n,i)=>({name:n, key:keys[i], seal:sealOf(code,keys[i]), traitor:isTraitor(code,keys[i]), status:"alive", shield:false, pt:"tp"+rid(16)})),
      votes:{}, candidates:null, revotes:0, banished:null, murder:null, endVotes:{}, log:[], winner:null };
    save(); hostListen(); render();
  };
}

// ---- host game ----
const PHASES = [["mission","Challenge"],["table","Round table"],["night","Night"],["breakfast","Breakfast"]];
function renderHost(){
  if (S.phase==="lobby") return renderLobby();
  if (S.phase==="over") return renderOver();
  const ph = S.phase==="final" ? "table" : S.phase;
  let body = "";
  if (S.phase==="mission") body = missionCard();
  else if (S.phase==="table") body = tableCard();
  else if (S.phase==="final") body = finalCard();
  else if (S.phase==="night") body = nightCard();
  else if (S.phase==="breakfast") body = breakfastCard();
  const f = alive().length;
  app.innerHTML = `
  <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Round ${S.round} · Code ${esc(S.code)}</div><h2>${S.phase==="final"?"The endgame":esc(PHASES.find(p=>p[0]===ph)[1])}</h2></div>
   <span class="muted small" style="text-align:right">${f} left${S.endsAt?`<br>Ends ${esc(fmtTime(S.endsAt))}`:""}</span></div>
  ${S.phase==="final"?"":`<div class="steps">${PHASES.map(p=>`<span class="step${p[0]===ph?" on":""}">${p[1]}</span>`).join("")}</div>`}
  ${paceCard()}
  ${body}
  ${announceCard()}
  <div class="card"><h3>The players</h3><div class="roster">${S.players.map(chip).join("")}</div></div>
  ${S.log.length?`<div class="card"><h3>What has happened</h3><div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div></div>`:""}
  <div class="row"><button class="ghost" id="roleChk">Check a role on this phone</button><button class="ghost" id="links">Personal links</button>${(S.phase==="mission"||S.phase==="table")&&!S._final?`<button class="ghost" id="toFinal">Time's up: go to the endgame</button>`:""}<button class="ghost" id="home">Home</button><button class="ghost" id="reset">End and reset</button></div>`;
  wireHost();
}
function chip(p){
  let tag = "";
  if (p.status==="murdered") tag = `<span class="tag m">Murdered</span>`;
  else if (p.status==="banished") tag = `<span class="tag b">Banished</span>`;
  else if (p.shield && !S.secretShields) tag = `<span class="tag s">Shield</span>`;
  return `<div class="chip${p.status!=="alive"?" out":""}${p.shield&&p.status==="alive"&&!S.secretShields?" shield":""}"><span>${esc(p.name)}</span>${tag}</div>`;
}
const WORDS = ["OWL","RAVEN","CANDLE","DAGGER","ACORN","LANTERN","CROWN","GOBLET","TURRET","CLOAK","FEATHER","GRAVY"];
function ensureCode(){ if (S.codeRound!==S.round){ S.codeRound=S.round; S.shieldCode=WORDS[Math.floor(Math.random()*WORDS.length)]; S.codeClaimed=false; S.winners=[]; S.drawn=0; save(); } }
function giveShield(p){ p.shield = true; publish(p.pt, {k:"shield", round:S.round, on:true}); }
function missionCard(){
  if (S.shields && S.secretShields){
    ensureCode();
    const w = S.winners||[];
    return `<div class="card"><h3>Lucky draw</h3><p>Tap everyone on the winning team, then draw. One of them gets a shield in secret. Not even this phone shows who.</p>
      <div class="roster">${alive().map(p=>`<button data-win="${esc(p.key)}" class="${w.includes(p.key)?"gold":""}">${esc(p.name)}</button>`).join("")}</div>
      <button class="primary wide" id="draw"${w.length?"":" disabled"}>Secretly give one winner a shield</button>
      ${S.drawn?`<p class="small" style="color:var(--gold)">🛡 ${S.drawn===1?"A shield has":S.drawn+" shields have"} been given out in secret this round.</p>`:""}</div>
    <button class="primary wide" id="toTable">Go to the round table</button>`;
  }
  const sh = S.shields ? `
    <p>Play a challenge. Then tap the winners to give them a shield. A shield protects them from murder tonight only.</p>
    <div class="roster">${alive().map(p=>`<button data-shield="${esc(p.key)}" class="${p.shield?"gold":""}">${p.shield?"🛡 ":""}${esc(p.name)}</button>`).join("")}</div>` :
    `<p>Play a challenge for the prize pot, then head to the round table.</p>`;
  return `<div class="card">${sh}<button class="primary wide" id="toTable">Go to the round table</button></div>`;
}
function tally(){
  const t = {}; for (const v of Object.values(S.votes)) if (v) t[v]=(t[v]||0)+1;
  return Object.entries(t).sort((a,b)=>b[1]-a[1]);
}
function tableCard(){
  const voters = alive();
  const cands = S.candidates ? S.candidates.map(byKey) : voters;
  const cast = voters.filter(v=>S.votes[v.key]).length;
  const tl = tally(); const max = tl.length?tl[0][1]:1;
  return `<div class="card">
   ${S.candidates?`<p><b>It's a tie.</b> The tied players each get 30 seconds to defend themselves. Then everyone else votes again, only for them.</p>`:`<p>Talk it out. When you're ready, go around the table. Each player names who they're voting for and why. Enter each vote as it's said.</p>`}
   <div class="stack">${voters.map(v=>{
     const can = S.candidates && S.candidates.includes(v.key);
     return `<div class="vote"><label for="v_${esc(v.key)}">${esc(v.name)}</label>
      ${can?`<span class="muted small">On trial, doesn't vote</span>`:`<select id="v_${esc(v.key)}" data-voter="${esc(v.key)}"><option value="">votes for…</option>
       ${cands.filter(c=>c.key!==v.key).map(c=>`<option value="${esc(c.key)}"${S.votes[v.key]===c.key?" selected":""}>${esc(c.name)}</option>`).join("")}</select>`}</div>`;}).join("")}</div>
   ${tl.length?`<hr><div class="tally">${tl.map(([k,n])=>`<div class="bar"><b>${esc(byKey(k).name)}</b><i style="width:${Math.round(n/max*45)}%"></i><em>${n}</em></div>`).join("")}</div>`:""}
   <button class="primary wide" id="banish"${cast?"":" disabled"}>Count the votes (${cast} cast)</button>
  </div>`;
}
function finalCard(){
  const voters = alive();
  const all = voters.every(v=>S.endVotes[v.key]);
  return `<div class="card">
   <p>Only ${voters.length} remain. Each player now chooses: <b>end the game</b>, or <b>banish again</b>. The game ends only if <b>everyone</b> votes to end. If any Traitor is still among you, the Traitors take the pot.</p>
   <div class="stack">${voters.map(v=>`<div class="vote"><span>${esc(v.name)}</span><div class="row" style="gap:6px;flex-wrap:nowrap">
     <button data-end="${esc(v.key)}" data-val="end" class="${S.endVotes[v.key]==="end"?"gold":""}" style="flex:1;padding:8px">End</button>
     <button data-end="${esc(v.key)}" data-val="again" class="${S.endVotes[v.key]==="again"?"primary":""}" style="flex:1;padding:8px">Banish</button></div></div>`).join("")}</div>
   <button class="primary wide" id="endGo"${all?"":" disabled"}>Reveal the decision</button></div>`;
}
function nightCard(){
  if (!S.window) return `<div class="card"><p>When you're ready, open the murder window. Each Traitor's page turns into a murder screen, and they choose a victim together on their own phones. Everyone else's page says night has fallen.</p>
  <button class="primary wide" id="openWin">Open the murder window</button></div>
  <div class="card"><h3>Backup: hidden phone</h3><p class="muted small">Only if a Traitor has no phone. Lock this phone in "the turret" and they unlock it with the PIN on their page.</p>
  <button class="wide" id="turret">Use the hidden phone instead</button></div>`;
  return S.locked
   ? `<div class="card"><h3>The Traitors have chosen</h3><p>The murder is locked in. Gather everyone for breakfast when you're ready.</p><button class="primary wide" id="toBreak">Go to breakfast</button></div>`
   : `<div class="card"><h3>The murder window is open</h3><p>The Traitors are choosing on their phones. This screen changes when they agree. Don't watch their faces.</p>
     ${S.offer?`<p class="muted small">They've made their move. Waiting on one more thing.</p>`:""}
     <p class="small" id="relay">${relayOK===false?"○ Reconnecting…":"● Live"}</p>

}
function breakfastCard(){
  return `<div class="card"><h3>The breakfast entrance</h3><p>Everyone waits outside the breakfast room. Put this phone just inside the room with the volume up. It calls survivors in one at a time, in random order. Whoever is left outside at the end was murdered.</p>
  <p class="muted small">Each person who walks in taps <b>Call the next guest</b>.</p>

    $("#dx",ov).onclick = () => { ov.hidden=true; };
    ov.querySelectorAll("[data-direct]").forEach(b => b.onclick = () => { giveShield(byKey(b.dataset.direct)); S.drawn=(S.drawn||0)+1; save(); ov.innerHTML = `<div class="inner"><div class="big">Done</div><p class="muted">The shield has been given in secret.</p><button class="wide" id="dk">Close</button></div>`; $("#dk",ov).onclick = () => { ov.hidden=true; render(); }; });
  };

  app.querySelectorAll("[data-voter]").forEach(sel => sel.onchange = () => { S.votes[sel.dataset.voter]=sel.value; save(); render(); const n=$("#v_"+CSS.escape(sel.dataset.voter)); if(n) n.focus(); });
  const bn = $("#banish"); if (bn) bn.onclick = countVotes;

  const pn = $("#paceNow"); if (pn) pn.onclick = () => { S.dueAt = Date.now(); S.dueFired = false; paceTick(); };
  const p5 = $("#pace5"); if (p5) p5.onclick = () => { S.dueAt += 5*60000; S.dueFired = false; save(); render(); };
  const tb = $("#toBreak"); if (tb) tb.onclick = () => { S.window=false; S.phase="breakfast"; S.called=[]; save(); render(); };
  const cw = $("#closeWin"); if (cw) cw.onclick = () => confirmBox("Close the murder window? Nobody will be murdered this round.", "Close it", () => { S.murder=null; S.locked=true; S.window=false; S.phase="breakfast"; S.called=[]; publish(S.tid,{k:"lock",round:S.round,v:"-"}); save(); render(); });
  const tf = $("#toFinal"); if (tf) tf.onclick = () => confirmBox("Time's up? Skip to the final vote: end the game or banish again.", "Go to the endgame", () => { logit("Time ran out. On to the endgame."); S.phase="final"; S.endVotes={}; save(); render(); });
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(b.dataset.copy, b));

function confirmBox(msg, label, yes){
  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><p style="font-size:1.2rem">${esc(msg)}</p><button class="primary wide" id="cy">${esc(label)}</button><button class="wide" id="cn">Cancel</button></div>`;

function passPhone(){
  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><h2>Whose role?</h2><p class="muted small">Hand the phone over. Only the player named should look.</p>
   <div class="victims">${S.players.map(p=>`<button data-who="${esc(p.key)}">${esc(p.name)}</button>`).join("")}</div>

  ov.querySelectorAll("[data-who]").forEach(b => b.onclick = () => { const p=byKey(b.dataset.who); secretReveal(p.name, p.traitor, p.seal, false, null, pinOf(S.code)); });
}

function countVotes(){
  const tl = tally(); if (!tl.length) return;
  const top = tl[0][1]; const tied = tl.filter(([,n])=>n===top).map(([k])=>k);
  if (tied.length>1){
    if (S.revotes>=1){ // second tie: fate decides
      const pick = tied[Math.floor(Math.random()*tied.length)];
      logit("Second tie between "+tied.map(k=>byKey(k).name).join(" and ")+". Fate chose.");
      return doBanish(pick, true);
    }
    S.candidates = tied; S.revotes++; S.votes={}; save(); render(); return;
  }
  doBanish(tied[0], false);
}
function doBanish(key, fate){
  const p = byKey(key); const n = Object.values(S.votes).filter(v=>v===key).length;
  p.status="banished"; logit(p.name+" was banished"+(fate?" by fate":" with "+n+" vote"+(n===1?"":"s"))+". They were "+(p.traitor?"a Traitor":"Faithful")+".");
  S.votes={}; S.candidates=null; S.revotes=0;
  if (p.traitor && traitorsAlive().length>0 && S.recruitOn!==false) S.recruit = true;
  save();
  dramatic(fate?"The tie stands. Fate has chosen":"The round table has spoken", p.name, "Their true role is", p.traitor, () => afterBanish());
}
function checkWin(){
  const t = traitorsAlive().length, f = alive().length - t;
  if (t===0){ S.winner="faithful"; S.phase="over"; return true; }
  if (t>=f){ S.winner="traitors"; S.phase="over"; return true; }
  return false;
}
function openWindow(){ S.sus={}; S.window=true; S.locked=false; S.picks={}; S.murder=null; S.offer=null;
  S.mode = S.recruit ? "recruit" : "murder"; S.recruit = false;
  publish(S.tid, {k:"mode", round:S.round, mode:S.mode, names: traitorsAlive().map(x=>x.name)}); }
function afterBanish(){
  if (checkWin()){ save(); return render(); }
  if (S.phase==="final" || alive().length<=S.finalSize){ S.phase="final"; S.endVotes={}; save(); return render(); }
  S.phase="night"; if (S.pace) openWindow(); save(); render();
}
function endDecision(){
  const vs = alive().map(v=>S.endVotes[v.key]);
  if (vs.every(v=>v==="end")){
    logit("Everyone voted to end the game.");
    S.winner = traitorsAlive().length ? "traitors" : "faithful"; S.phase="over"; save(); return render();
  }
  logit("Not unanimous. Another banishment.");
  S.phase="final-table"; S.endVotes={};
  // reuse table for one more banishment, then back to final
  S.phase="table"; S._final=true; S.votes={}; S.candidates=null; S.revotes=0; save(); render();
}

// dramatic reveal (role reveal after banish or murder)

// ---- night ----

function fmtTime(t){ const m=/^(\d{1,2}):(\d{2})/.exec(t||""); if(!m) return t; let h=+m[1]; const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+m[2]+" "+ap; }
function copyText(t, btn){
  const done = () => { const o=btn.textContent; btn.textContent="Copied"; setTimeout(()=>btn.textContent=o,1500); };
  try{ navigator.clipboard.writeText(t).then(done, () => sel()); }catch(e){ sel(); }
  function sel(){ const el=btn.previousElementSibling; if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } }
}
function announceText(){
  const end = S.endsAt?` The game ends at ${fmtTime(S.endsAt)}.`:"";
  return ({
    lobby:"Open your link and check your secret role. The game starts soon.",
    mission:"Shield challenge starting in 5 minutes! Winners get a shield that protects them from murder tonight.",
    table:"Round table in 5 minutes. Time to banish someone. Bring your suspicions."+end,
    night:"Night has fallen. Everyone, open your night screen.",
    breakfast:"Breakfast time. Everyone wait outside the breakfast room. You'll be called in one at a time.",
    final:"Endgame. Everyone left, to the table now. Decide: end the game or banish again.",
    over:"The game is over."
  })[S.phase] || "";
}
function announceCard(){
  const end = S.endsAt?` The game ends at ${fmtTime(S.endsAt)}.`:"";
  const m = {
    mission:"Shield challenge starting in 5 minutes! Winners get a shield that protects them from murder tonight.",
    table:"Round table in 5 minutes. Time to banish someone. Bring your suspicions."+end,
    night:"Night has fallen. Check your page. Breakfast will be called soon.",
    breakfast:"Breakfast time. Everyone wait outside the breakfast room. You'll be called in one at a time.",
    final:"Endgame. Everyone left, to the table now. It's time to decide whether to end the game or banish again."
  }[S.phase];
  if (!m) return "";
  return `<div class="card"><h3>Message for the group text</h3><p class="muted small">Everyone's page already shows this. Text it too so phones buzz.</p><p id="ann">${esc(m)}</p><button class="wide" data-copy="${esc(m)}">Copy message</button></div>`;
}
function turretLock(){
  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><div class="eyebrow">The turret</div><div class="big">Traitors only</div>
   <p class="muted">If you aren't a Traitor, put this phone back and walk away.</p>
   <div class="field"><label for="pin">Traitor PIN</label><input id="pin" inputmode="numeric" autocomplete="off" maxlength="4" style="text-align:center;font-size:1.6rem;letter-spacing:.3em"></div>
   <p class="err" id="pinerr" hidden></p>
   <button class="primary wide" id="unl">Unlock</button>
   <button class="ghost" id="tcancel" style="margin-top:30px">Host: close the murder window</button></div>`;
  $("#unl",ov).onclick = () => {
    if ($("#pin",ov).value.trim()===pinOf(S.code)) return runNightPick();
    const e=$("#pinerr",ov); e.textContent="Wrong PIN."; e.hidden=false; $("#pin",ov).value="";
  };
  $("#tcancel",ov).onclick = () => { ov.innerHTML = `<div class="inner"><p style="font-size:1.2rem">Close the murder window without a murder? Only do this if the Traitors ran out of time.</p><button class="primary wide" id="cy">Close it, nobody dies</button><button class="wide" id="cn">Keep it open</button></div>`;
    $("#cy",ov).onclick = () => { S.turret=false; S.murder=null; S.phase="breakfast"; save(); ov.hidden=true; render(); };
    $("#cn",ov).onclick = turretLock; };
}
function runNightPick(){ // back to picking without re-narration
  const traitors = traitorsAlive(); const victims = alive().filter(p=>!p.traitor && !p.shield);
  ov.innerHTML = `<div class="inner"><div class="eyebrow">Traitors only</div><h2>Choose your victim</h2>
   <p>The Traitors: <b style="color:var(--blood)">${traitors.map(t=>esc(t.name)).join(", ")}</b></p>
   <div class="victims">${victims.map(v=>`<button data-kill="${esc(v.key)}">${esc(v.name)}</button>`).join("")}</div>
   <button class="ghost wide" id="spare">Spare everyone tonight</button></div>`;
  ov.querySelectorAll("[data-kill]").forEach(b => b.onclick = () => confirmKill(b.dataset.kill));
  $("#spare",ov).onclick = () => confirmKill(null);
}
function breakfast(){
  let key = S.murder; let blocked = false;
  if (key && byKey(key).shield){ blocked = true; key = null; }
  const victim = key ? byKey(key) : null;
  const queue = alive().filter(p => p.key!==key).map(p=>p.key);
  for (let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
  let idx = 0; S.called = []; save();
  const next = () => { S.murder=null; S.sus={}; S.called=[]; S.picks={}; S.window=false; S.locked=false; S.players.forEach(p=>p.shield=false); S.round++; if (checkWin()){ save(); return render(); }
    S.phase = alive().length<=S.finalSize ? "final" : "mission"; S.endVotes={}; save(); render(); };
  ov.hidden=false;
  ov.innerHTML = `<div class="inner"><div class="eyebrow">Breakfast</div><div class="big">Breakfast is served</div>
    <p class="muted">Everyone wait outside. I'll call you in one at a time.</p>
    <button class="gold wide" id="call" style="min-height:70px">Call the first guest</button></div>`;
  say("Breakfast is served. Everyone, wait outside. I will call you in, one at a time.");
  const call = () => {
    if (idx >= queue.length) return finale();
    const p = byKey(queue[idx++]);
    S.called = (S.called||[]).concat(p.name); save();
    say(p.name + ". Come in to breakfast.");
    ov.innerHTML = `<div class="inner"><div class="eyebrow">Guest ${idx} of ${queue.length + (victim?1:0)}</div>
      <div class="big fade">${esc(p.name)}</div><p class="muted">Come in to breakfast.</p>
      <button class="gold wide" id="call" style="min-height:70px">${idx>=queue.length?"Everyone's called. Who's missing?":"Call the next guest"}</button></div>`;
    $("#call",ov).onclick = call;
  };
  const susLine = (() => { const g = S.sus||{}; const n = Object.keys(g).length; if (!n) return "";
    const answer = victim ? victim.name : "-";
    const right = Object.entries(g).filter(([by,v]) => v===answer).map(([by])=>by);
    return `<p class="small" style="color:var(--gold)">${right.length ? `🔮 Guessed it right: <b>${right.map(esc).join(", ")}</b> (${right.length} of ${n}).` : `🔮 Nobody guessed it. ${n} guess${n===1?"":"es"} were made.`}</p>`; })();
  const finale = () => {
    if (!victim){
      logit(blocked ? "The Traitors' victim was protected by a shield." : "The Traitors spared everyone.");
      say("Everyone made it through the night.");
      ov.innerHTML = `<div class="inner"><div class="eyebrow">Breakfast</div><div class="big fade">Everyone survived</div><p class="muted">${blocked?"The Traitors struck, but their victim was protected by a shield.":"The Traitors held back last night. Why?"}</p>${susLine}<button class="wide" id="bc">Continue</button></div>`;
      $("#bc",ov).onclick = () => { ov.hidden=true; next(); }; return;
    }
    say("Everyone who survived the night is here. Whoever is still outside, was murdered.");
    ov.innerHTML = `<div class="inner"><div class="eyebrow">Breakfast</div><h2>Everyone who survived is here</h2>
      <p class="muted">Whoever is still outside was murdered by the Traitors.</p><div id="mr" style="min-height:120px"></div>
      <button class="gold wide" id="mv">Reveal the victim</button></div>`;
    $("#mv",ov).onclick = () => {
      victim.status="murdered"; logit(victim.name+" was murdered in the night."); save();
      $("#mr",ov).innerHTML = `<div class="big fade" style="color:var(--blood)">${esc(victim.name)}</div><p class="muted">Murdered. They were Faithful. Let them in.</p>${susLine}`;
      say(victim.name + " was murdered. They were Faithful.");
      const b=$("#mv",ov); b.textContent="Continue"; b.className="wide"; b.onclick = () => { ov.hidden=true; next(); };
    };
  };
  $("#call",ov).onclick = call;
}

// patch afterBanish for the endgame loop
const _afterBanish = afterBanish;
afterBanish = function(){ if (S._final){ S._final=false; if (checkWin()){ save(); return render(); } S.phase="final"; S.endVotes={}; save(); return render(); } _afterBanish(); };

// ---- lobby & over ----
function renderLobby(){
  app.innerHTML = `
  <div class="hero"><div class="eyebrow">Game phone · The Traitors are chosen</div><h2>Tell everyone the code</h2>
   <div class="code" style="margin-top:10px">${esc(S.code)}</div>
   <p class="muted small">Guests open the link, tap <b>Check my role</b>, and type this code and their name exactly as listed below. Their phone shows a two-letter seal. It should match the seal here.</p></div>
  <div class="card"><h3>Send everyone their link</h3><p>Each player gets a personal link to their own live page. It shows their role, updates as the game moves on, and becomes the Traitors' murder screen at night.</p>
   <button class="primary wide" id="links">Get personal links</button></div>
  <div class="card"><h3>Players and seals</h3>
   <div class="roster">${S.players.map(p=>`<div class="chip"><span>${esc(p.name)}</span><span class="tag s">${esc(p.seal)}</span></div>`).join("")}</div>
   <p class="muted small">No phone? Tap below and pass this phone around. Each player taps their name and holds to see their role.</p>
   <button class="wide" id="roleChk">Check roles on this phone</button></div>
  <div class="card"><p>Everyone knows their role? Begin with the first challenge.</p>
   <button class="primary wide" id="start">Start round 1</button></div>
  <div class="row"><button class="ghost" id="home">Home</button><button class="ghost" id="reset">Start over</button></div>`;
  $("#roleChk").onclick = passPhone;
  $("#links").onclick = linksBox;
  $("#start").onclick = () => { S.phase="mission"; save(); render(); };
  $("#home").onclick = () => { view="home"; render(); };
  $("#reset").onclick = () => confirmBox("Start over? New Traitors will be chosen.", "Start over", () => { S=null; try{localStorage.removeItem(KEY);}catch(e){} render(); });
}
function renderOver(){
  const fw = S.winner==="faithful";
  const tr = S.players.filter(p=>p.traitor);
  app.innerHTML = `
  <div class="hero"><div class="eyebrow">The game is over</div>
   <div class="code" style="font-size:2.4rem;color:${fw?"var(--faith)":"var(--blood)"}">${fw?"The Faithful win":"The Traitors win"}</div>
   <p>${fw?"Every Traitor has been found. The Faithful share the prize pot.":"A Traitor survived to the end. The Traitors take the prize pot."}</p></div>
  <div class="card"><h3>The Traitors were</h3><div class="roster">${tr.map(p=>`<div class="chip"><span>${esc(p.name)}</span><span class="tag m">${p.status==="alive"?"Survived":"Banished"}</span></div>`).join("")}</div></div>
  <div class="card"><h3>Everyone</h3><div class="roster">${S.players.map(chip).join("")}</div></div>
  ${S.log.length?`<div class="card"><h3>How it went</h3><div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div></div>`:""}
  <button class="primary wide" id="again">Play again with the same names</button>
  <button class="ghost" id="home">Home</button>`;
  $("#again").onclick = () => { draft.names = S.players.map(p=>p.name).join("\n"); saveDraft(); S=null; try{localStorage.removeItem(KEY);}catch(e){} render(); };
  $("#home").onclick = () => { view="home"; render(); };
}

load();
if (S && S.tid) { hostListen(); broadcast(); }
personal = parseToken(location.hash);
window.addEventListener("hashchange", () => { personal = parseToken(location.hash); render(); });
render();
if (!personal && S && S.turret){ view="host"; render(); turretLock(); }
})();
</script>

</body></html>
